<body>
    <header class="topo">

                Início

            <a href="sobre.html">Sobre</a>

    <main>
        <section class="conteudo contato-card">
            <h1>Contato</h1>
            <p>me manda uns level ai pa eu ve pra pasar</p>

            <form class="form" action="#">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="name" placeholder="seu nome">
                </div>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="text" id="email" name="email" placeholder="voce@email.com">
                </div>
                <div class="campo">
                    <label for="msg">Mensagem</label>
                    <textarea name="msg" id="msg" rows="4" placeholder="Escreva sua msg">

                    </textarea>
                    
                </div>
                <button type="submit" class="botao">
                    Enviar
                </button>
            </form>
        </section>
    </main>
    <footer class ="rodape">
    <p>Feito por Rafael - projeto frontend</p>
    </footer>
